[package]
name = "lighter"
version = "0.1.0"
description = "Multi-session cockpit for Claude Code CLI"
authors = ["Grzegorz Handzel"]
edition = "2021"
default-run = "lighter"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lighter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-window-state = "2.4.1"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
win32job = "2.0.3"
which = "8.0.5"
dunce = "1.0.5"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-json-impl"] }
futures-util = "0.3.33"
unicode-normalization = "0.1.25"
tiktoken-rs = "0.12.0"
serde_yaml = "0.9.34"

